<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">WSL 2 Ubuntu runtime evidence</title>
  <desc id="desc">Verified output summary showing Ubuntu running with WSL version 2.</desc>
  <rect width="1000" height="300" rx="20" fill="#0d1117"/>
  <rect x="30" y="30" width="940" height="240" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="62" cy="62" r="8" fill="#ff5f56"/><circle cx="88" cy="62" r="8" fill="#ffbd2e"/><circle cx="114" cy="62" r="8" fill="#27c93f"/>
  <text x="55" y="115" fill="#8b949e" font-family="Consolas, monospace" font-size="24">PS&gt; wsl -l -v</text>
  <text x="55" y="165" fill="#c9d1d9" font-family="Consolas, monospace" font-size="23">NAME       STATE       VERSION</text>
  <text x="55" y="210" fill="#58a6ff" font-family="Consolas, monospace" font-size="25">* Ubuntu    Running     2</text>
  <text x="720" y="248" fill="#3fb950" font-family="Arial, sans-serif" font-size="18">RUNTIME VERIFIED</text>
</svg>
